<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 68 352 352" role="img" aria-label="PostWall">
  <title>PostWall mark</title>
  <!-- The app mark (postwall-ui src/assets/logo/postwall-mark.svg), cropped to the notes for small
       sizes, with the app icon's cast shadow so pastel edges hold on light backgrounds. -->
  <defs>
    <filter id="cast" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#2A2823" flood-opacity=".28"/>
    </filter>
  </defs>
  <g filter="url(#cast)">
    <g transform="translate(232,236) rotate(-11)">
      <rect x="-124" y="-124" width="248" height="248" rx="20" fill="#C1D2E7"/>
    </g>
    <g transform="translate(268,246) rotate(6)">
      <rect x="-124" y="-124" width="248" height="248" rx="20" fill="#C3DCC5"/>
    </g>
    <g transform="translate(252,266) rotate(-3)">
      <path d="M -104 -124 H 104 A 20 20 0 0 1 124 -104 V 60 L 60 124 H -104 A 20 20 0 0 1 -124 104 V -104 A 20 20 0 0 1 -104 -124 Z" fill="#FDF1B8"/>
      <path d="M 124 60 L 60 124 V 80 A 20 20 0 0 1 80 60 Z" fill="#EADFA7"/>
    </g>
  </g>
</svg>
